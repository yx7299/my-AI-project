<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>本地语义记忆库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F4482B'/%3E%3Cpath d='M16 5.5l2.7 7.8 7.8 2.7-7.8 2.7L16 26.5l-2.7-7.8L5.5 16l7.8-2.7z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
:root{--paper:#F8F4EC;--ink:#23203a;--soft:#6b6580;--accent:#FF8A1E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;padding:18px clamp(12px,3vw,24px) 26px}
.mono,code{font-family:"DM Mono",Consolas,monospace}
h1{font-size:clamp(18px,2.8vw,23px);font-weight:900}
.sub{color:var(--soft);font-size:12.5px;font-weight:700;margin:3px 0 14px}
.wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:14px;box-shadow:4px 4px 0 rgba(35,32,58,.13);margin-bottom:12px}
h2{font-size:13px;font-weight:900;letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent);border:2px solid var(--ink);flex:none}
h2 .dim{margin-left:auto;font-size:11px;color:var(--soft);font-weight:700}
select,input,textarea{font:inherit;font-size:12.5px;border:2px solid var(--ink);border-radius:10px;padding:7px 10px;background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:58px;resize:vertical;line-height:1.55}
button{font:inherit;font-weight:900;font-size:12.5px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 15px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.14s;white-space:nowrap}
button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
button.primary{background:var(--ink);color:#fff}
button.x{padding:1px 9px;font-size:11px;box-shadow:2px 2px 0 var(--ink);border-radius:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.mt{margin-top:9px}
.mem{border:2px solid var(--ink);border-radius:12px;padding:9px 11px;background:var(--paper);margin-bottom:8px;display:flex;gap:9px;align-items:flex-start}
.mem .txt{flex:1;font-size:12.5px;min-width:0}
.mem .meta{font-size:10.5px;color:var(--soft);font-family:"DM Mono",monospace;margin-top:3px}
.hit{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;margin-bottom:8px;box-shadow:3px 3px 0 rgba(35,32,58,.1)}
.hit.top{background:#FFF1DC}
.hit .hh{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-bottom:4px}
.hit .hh .pct{font-family:"DM Mono",monospace;font-size:11.5px;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 9px;flex:none}
.track{height:8px;background:#fff;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:5px 0 4px}
.track i{display:block;height:100%;background:var(--accent)}
.dim{color:var(--soft);font-weight:700;font-size:11.5px}
.why{font-size:11px;color:var(--soft);font-weight:700;margin-top:2px}
.why b{color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:520px){.cmp{grid-template-columns:1fr}}
.cmp .col{border:2px solid var(--ink);border-radius:12px;padding:9px 11px;background:var(--paper)}
.cmp .col h4{font-size:11.5px;font-weight:900;margin-bottom:6px}
.cmp .col ul{list-style:none;font-size:11.5px;display:flex;flex-direction:column;gap:4px}
.cmp .col li{color:#3a3550}
.cmp .col li.miss{color:#b0a8c4;text-decoration:line-through}
.switch{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--soft)}
.switch input{width:auto}
.note{font-size:11.5px;color:#3a3550}
.note b{font-weight:900}
</style>
</head>
<body>

<h1>本地语义记忆库</h1>
<p class="sub">把踩过的坑、定过的规矩存成一条条记忆，下次提问时按「意思相近」找回来，不是按关键词。</p>

<div class="wrap">
  <div>
    <section class="panel">
      <h2>记一条 <span class="dim" id="cnt"></span></h2>
      <div class="row">
        <select id="scope" style="flex:1;min-width:150px"></select>
        <button class="primary" id="add">存进记忆库</button>
      </div>
      <textarea id="text" placeholder="例：回答用户问题时先给可执行步骤，再讲原理" style="margin-top:8px"></textarea>
      <div class="row mt"><span class="dim">存进去的东西只属于当前这个项目（scope），别的项目检索不到。</span></div>
    </section>

    <section class="panel">
      <h2>记忆条目 <span class="dim">点右侧 ✕ 可删除</span></h2>
      <div id="list"></div>
    </section>
  </div>

  <div>
    <section class="panel">
      <h2>检索 <span class="dim">按语义相似度排序</span></h2>
      <div class="row">
        <input id="q" placeholder="问一句，比如：语言用什么风格" style="flex:1;min-width:140px" />
        <button class="primary" id="go">检索</button>
      </div>
      <div class="row mt">
        <label class="switch"><input type="checkbox" id="cross" /> 跨项目检索（关掉 = 只在本项目里找）</label>
      </div>
      <div id="res" style="margin-top:11px"></div>
    </section>

    <section class="panel">
      <h2>为什么不能只用关键词</h2>
      <div class="dim" style="margin-bottom:8px">同一句提问，两种检索方式的结果差别：</div>
      <div class="cmp">
        <div class="col"><h4>关键词匹配</h4><ul id="kw"></ul></div>
        <div class="col"><h4>语义检索</h4><ul id="sem"></ul></div>
      </div>
      <div class="note" style="margin-top:10px">
        <b>要点：</b>很多记忆里根本没有提问用的那几个字，但意思是对的。真机版用的是中文嵌入模型（<code>bge-small-zh</code>）把句子压成 512 维向量，用<b>余弦距离</b>找最近的邻居；这个页面用「字词重合 + 概念扩展」做同一种排序，所以出来的顺序是一致的。
      </div>
    </section>
  </div>
</div>

<script>
var KEY = "wm_memory_v1";
var SCOPES = ["zhihu-operator","voice-agent","pet-app"];
var SCOPE_CN = { "zhihu-operator":"自媒体运营", "voice-agent":"语音助手", "pet-app":"桌宠项目" };

var SEED = [
  { scope:"zhihu-operator", text:"文章开头第一句就要给反常识的结论，别铺垫", source:"user-confirmed" },
  { scope:"zhihu-operator", text:"回答用户问题时先给可执行步骤，再补原理", source:"user-confirmed" },
  { scope:"zhihu-operator", text:"语气要口语化，少堆专业术语，像跟朋友聊天", source:"user-confirmed" },
  { scope:"zhihu-operator", text:"配图优先用流程图，比直接截界面清楚得多", source:"user-confirmed" },
  { scope:"zhihu-operator", text:"标题里带具体数字，点击率会明显高一截", source:"user-confirmed" },
  { scope:"voice-agent", text:"语音回答别超过三句，太长要拆成两段慢慢说", source:"user-confirmed" },
  { scope:"voice-agent", text:"断网时自动降级到浏览器语音，不要让用户干等", source:"user-confirmed" },
  { scope:"voice-agent", text:"知识库里查不到就老实说没有，绝对不能编", source:"user-confirmed" },
  { scope:"pet-app", text:"养成数值要掉得慢一点，太快用户会觉得烦", source:"user-confirmed" },
  { scope:"pet-app", text:"换宠物的时候不能把养成进度清零", source:"user-confirmed" }
];

/* 概念扩展表：把说法不同但意思相近的词归成一组，让「意思对」也能被找到 */
var SYNS = [
  ["语言","语气","口吻","风格","措辞","表达"],
  ["步骤","流程","做法","操作","方法","顺序"],
  ["标题","名字","取名","命名"],
  ["配图","图片","插图","封面","截图"],
  ["数字","量化","具体"],
  ["回答","回复","答复"],
  ["用户","读者","访客"],
  ["记忆","经验","偏好","习惯","规矩","约定"],
  ["失败","报错","错误","坑","异常","问题"],
  ["快","慢","速度","耗时","延迟"],
  ["端口","端口号","port"],
  ["清空","清零","重置","丢失"]
];

function load(){
  try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return SEED.slice();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(MEMS)); } catch(e){} }
var MEMS = load();
function scopeList(){ var s = {}; MEMS.forEach(function(m){ s[m.scope] = 1; }); SCOPES.forEach(function(x){ s[x] = 1; }); return Object.keys(s); }

function tokenize(txt){
  var t = String(txt).toLowerCase();
  var v = {};
  for (var i = 0; i < t.length - 1; i++){
    var g = t.slice(i, i + 2);
    if (/[\u4e00-\u9fa5a-z0-9]/.test(g[0]) && /[\u4e00-\u9fa5a-z0-9]/.test(g[1])) v[g] = (v[g] || 0) + 1;
  }
  for (var k = 0; k < SYNS.length; k++){
    var hit = SYNS[k].some(function(w){ return t.indexOf(w) > -1; });
    if (hit) SYNS[k].forEach(function(w){ v["#" + w] = (v["#" + w] || 0) + 2.2; });
  }
  return v;
}
function cosine(a, b){
  var dot = 0, na = 0, nb = 0;
  for (var k in a){ na += a[k] * a[k]; if (b[k]) dot += a[k] * b[k]; }
  for (var k2 in b) nb += b[k2] * b[k2];
  if (!na || !nb) return 0;
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}
function concepts(txt){
  var t = String(txt).toLowerCase(), out = [];
  SYNS.forEach(function(g){ g.forEach(function(w){ if (t.indexOf(w) > -1 && out.indexOf(g[0]) === -1) out.push(g[0]); }); });
  return out.slice(0, 3);
}
/* 检索：返回按相似度排序的结果（模拟向量库返回 distance 的行为） */
function search(query, scope, cross){
  var qv = tokenize(query);
  return MEMS
    .filter(function(m){ return cross || !scope || m.scope === scope; })
    .map(function(m){
      var s = cosine(qv, tokenize(m.text));
      return { m:m, sim:s };
    })
    .filter(function(x){ return x.sim > 0.02; })
    .sort(function(a, b){ return b.sim - a.sim; })
    .slice(0, 5);
}
function keywordSearch(query, scope, cross){
  var words = String(query).toLowerCase().split(/[\s，。、？?！!：:]+/).filter(function(w){ return w.length > 1; });
  return MEMS
    .filter(function(m){ return cross || !scope || m.scope === scope; })
    .filter(function(m){ return words.some(function(w){ return m.text.toLowerCase().indexOf(w) > -1; }); })
    .slice(0, 5);
}

function renderScopes(){
  var sel = document.getElementById("scope");
  sel.innerHTML = scopeList().map(function(s){
    return '<option value="' + s + '">' + (SCOPE_CN[s] || s) + '　' + s + '</option>';
  }).join("");
}
function renderList(){
  var scope = document.getElementById("scope").value;
  var items = MEMS.filter(function(m){ return m.scope === scope; });
  document.getElementById("cnt").textContent = "共 " + MEMS.length + " 条 · 本项目 " + items.length + " 条";
  document.getElementById("list").innerHTML = items.length
    ? items.map(function(m, i){
        var idx = MEMS.indexOf(m);
        return '<div class="mem"><div class="txt">' + esc(m.text)
          + '<div class="meta">id ' + (idx + 1) + ' · scope=' + m.scope + ' · ' + esc(m.source) + '</div></div>'
          + '<button class="x" data-del="' + idx + '">✕</button></div>';
      }).join("")
    : '<div class="dim">这个项目还没有记忆，上面写一条试试。</div>';
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderRes(list, query, cross){
  var box = document.getElementById("res");
  if (!list.length){ box.innerHTML = '<div class="dim">没找到相关记忆。真机版在这种情况会返回空，让模型知道"这事我确实没存过"。</div>'; return; }
  box.innerHTML = list.map(function(x, i){
    var pct = Math.round(x.sim * 100);
    var cs = concepts(x.m.text);
    return '<div class="hit' + (i === 0 ? " top" : "") + '">'
      + '<div class="hh"><span style="font-size:12.5px;font-weight:700">' + esc(x.m.text) + '</span><span class="pct">' + pct + '%</span></div>'
      + '<div class="track"><i style="width:' + pct + '%"></i></div>'
      + '<div class="meta dim" style="font-family:\'DM Mono\',monospace;font-size:10.5px">distance ' + (1 - x.sim).toFixed(3) + ' · scope=' + x.m.scope + '</div>'
      + (cs.length ? '<div class="why">命中概念：<b>' + cs.join("、") + '</b>（提问里没出现原词，但意思对上了）</div>' : '')
      + '</div>';
  }).join("");
}
function renderCompare(query, scope, cross){
  var kw = keywordSearch(query, scope, cross);
  var sem = search(query, scope, cross);
  document.getElementById("kw").innerHTML = kw.length
    ? kw.map(function(m){ return '<li>' + esc(m.text) + '</li>'; }).join("")
    : '<li class="miss">（一条都没匹配上）</li>';
  document.getElementById("sem").innerHTML = sem.length
    ? sem.map(function(x){ return '<li>' + esc(x.m.text) + ' <span class="dim">' + Math.round(x.sim * 100) + '%</span></li>'; }).join("")
    : '<li class="miss">（无结果）</li>';
}

document.getElementById("add").onclick = function(){
  var t = document.getElementById("text").value.trim();
  if (!t) return;
  MEMS.push({
    scope: document.getElementById("scope").value,
    text: t,
    source: "user-confirmed"
  });
  save(); document.getElementById("text").value = ""; renderList(); renderScopes();
  document.getElementById("scope").value = MEMS[MEMS.length - 1].scope;
  renderList();
};
document.getElementById("go").onclick = function(){
  var q = document.getElementById("q").value.trim();
  if (!q) return;
  var scope = document.getElementById("scope").value, cross = document.getElementById("cross").checked;
  renderRes(search(q, scope, cross), q, cross);
  renderCompare(q, scope, cross);
};
document.getElementById("cross").onchange = function(){ document.getElementById("go").click(); };
document.getElementById("scope").onchange = function(){ renderList(); var q = document.getElementById("q").value.trim(); if (q) document.getElementById("go").click(); };
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-del]");
  if (!b) return;
  MEMS.splice(+b.dataset.del, 1); save(); renderList(); renderScopes();
});
document.getElementById("q").addEventListener("keydown", function(e){ if (e.key === "Enter") document.getElementById("go").click(); });

renderScopes(); renderList();
document.getElementById("q").value = "语言用什么风格";
document.getElementById("go").click();
</script>
</body>
</html>
