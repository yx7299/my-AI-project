<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>作品集后台编辑器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F4482B'/%3E%3Cpath d='M16 5.5l2.7 7.8 7.8 2.7-7.8 2.7L16 26.5l-2.7-7.8L5.5 16l7.8-2.7z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
:root{
  --paper:#F8F4EC; --ink:#23203a; --line:#23203a;
  --red:#F4482B; --orange:#FF8A1E; --yellow:#FFC21A; --teal:#10B6A6; --blue:#2E6FE6; --lime:#7CCB1E;
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
a{color:inherit}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;background:#fff;border-bottom:2px solid var(--ink);box-shadow:0 4px 0 rgba(35,32,58,.08)}
.topbar .ttl{font-family:"DM Mono",monospace;font-weight:700;font-size:16px;margin-right:auto;display:flex;align-items:center;gap:10px}
.topbar .ttl b{background:var(--ink);color:#fff;border-radius:999px;padding:5px 14px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn.primary{background:var(--ink);color:#fff;box-shadow:3px 3px 0 var(--red)}
.btn.ghost{box-shadow:3px 3px 0 var(--yellow)}
/* 布局 */
.layout{display:grid;grid-template-columns:minmax(360px,520px) 1fr;gap:0;min-height:calc(100vh - 58px)}
.form-col{padding:22px;overflow:auto;max-height:calc(100vh - 58px);border-right:2px dashed var(--ink)}
.preview-col{display:flex;flex-direction:column;background:#ece7db}
.prev-head{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:2px solid var(--ink);font-weight:800}
.prev-head span{font-family:"DM Mono",monospace;font-size:13px;color:var(--ink);opacity:.7}
#prev{flex:1;width:100%;border:0;background:#fff}
/* 卡片区块 */
.card{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:18px 18px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
.card>h3{font-size:19px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card>h3:before{content:"";width:14px;height:14px;border-radius:4px;background:var(--red);border:2px solid var(--ink)}
label{display:block;margin-bottom:13px;font-weight:700;font-size:13px;color:var(--ink)}
label .hint{font-weight:500;color:#8a85a0;font-size:12px;margin-left:6px}
input[type=text],input[type=url],textarea,select{width:100%;margin-top:6px;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;font:inherit;background:var(--paper);color:var(--ink)}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* 动态子项 */
.item{border:2px dashed var(--ink);border-radius:14px;padding:12px;margin-bottom:12px;background:#fcfaf4;position:relative}
.item .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:900;font-size:13px;color:var(--red)}
.mini{font-size:12px;padding:5px 10px;border:2px solid var(--ink);border-radius:9px;background:#fff;cursor:pointer;font-weight:800}
.mini.del{background:var(--red);color:#fff;border-color:var(--ink)}
.mini.add{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.mini:hover{transform:translate(-1px,-1px)}
.addline{text-align:center;margin-top:4px}
.lrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.lrow .mini.del{padding:8px 10px}
/* 提示/草稿条 */
.fb{position:fixed;inset:0;z-index:50;background:rgba(248,244,236,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px}
.fb.hidden{display:none}
.fb .box{border:2px solid var(--ink);border-radius:20px;padding:30px;max-width:520px;background:#fff;box-shadow:var(--shadow)}
.fb h2{font-size:22px;margin-bottom:10px}
.fb p{color:var(--ink-soft);margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;font-weight:800;z-index:80;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
/* 生成结果面板 */
.rep{position:fixed;inset:0;z-index:60;background:rgba(35,32,58,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.rep.hidden{display:none}
.rep .box{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:24px;max-width:640px;width:100%;max-height:80vh;overflow:auto;box-shadow:6px 6px 0 var(--ink)}
.rep h2{font-size:20px;font-weight:900;margin-bottom:6px}
.rep .big{font-family:"DM Mono",monospace;font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.rep ul{list-style:none;margin:10px 0 16px}
.rep li{font-size:13px;padding:6px 0 6px 22px;position:relative;border-bottom:1px dashed #ece7db;word-break:break-all}
.rep li:before{content:"·";position:absolute;left:6px;font-weight:900}
.rep li.ok:before{content:"✓";color:#12a56a}
.rep li.no:before{content:"✕";color:var(--red)}
.rep .tip{font-size:12px;color:#8a85a0;background:var(--paper);border:2px dashed var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.rep .acts{display:flex;gap:10px;flex-wrap:wrap}
/* 折叠区 */
details.sub{border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:12px;background:#fff}
details.sub>summary{font-weight:900;font-size:13px;cursor:pointer;color:var(--red)}
details.sub[open]>summary{margin-bottom:10px}
.badge{display:inline-block;font-size:11px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;background:var(--paper);margin-left:6px}
.badge.dim{opacity:.45;font-weight:600}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .form-col{max-height:none;border-right:0;border-bottom:2px dashed var(--ink)}
  .preview-col{height:70vh}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="ttl"><b>CMS</b> 作品集后台编辑器</div>
  <button class="btn ghost" id="saveDraft">存草稿</button>
  <button class="btn ghost" id="loadDraft">读草稿</button>
  <button class="btn" id="reset">重置为模板</button>
  <button class="btn" id="download">下载 index.html</button>
  <button class="btn primary" id="genSite">⚡ 生成完整站点</button>
</header>

<div class="layout">
  <div class="form-col" id="form"></div>
  <div class="preview-col">
    <div class="prev-head"><span>实时预览（右侧即访客看到的成品）</span></div>
    <iframe id="prev" title="预览"></iframe>
  </div>
</div>

<div class="fb hidden" id="fb">
  <div class="box">
    <h2>本地模式：请选择 index.html</h2>
    <p>检测到没在网站环境里打开（比如直接双击文件）。选一下同目录下的 <b>index.html</b>，编辑器就能加载模板开始填内容。部署到 GitHub Pages 后会自动加载，不用这一步。</p>
    <input type="file" id="filePick" accept=".html" />
    <p style="margin-top:16px">如果还要「生成完整站点」，再选一次<b>整个项目文件夹</b>（含 <b>works/</b> 和 <b>admin.html</b> 那层），演示页和素材才能一起打包：</p>
    <input type="file" id="dirPick" webkitdirectory directory multiple />
  </div>
</div>

<div class="rep hidden" id="rep"><div class="box" id="repBox"></div></div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const form = $("#form"), prev = $("#prev"), fb = $("#fb"), toastEl = $("#toast");
const DRAFT = "portfolio_draft_v1";
let tplHtml = "", data = null;

/* ---------- 模板加载 ---------- */
async function init(){
  try{
    const r = await fetch("./index.html", {cache:"no-store"});
    if(!r.ok) throw 0;
    tplHtml = await r.text();
  }catch(e){ fb.classList.remove("hidden"); return; }
  afterTpl();
}
function showFallback(){ /* 已用 #fb 元素 */ }
$("#filePick").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  tplHtml = await f.text();
  fb.classList.add("hidden");
  afterTpl();
});

function afterTpl(){
  parseData();
  buildForm();
  bindGlobal();
  renderPreview();
  const d = localStorage.getItem(DRAFT);
  if(d) toast("检测到本地草稿，点「读草稿」可恢复");
}
function parseData(){
  const m = tplHtml.match(/\/\* === DATA_START === \*\/([\s\S]*?)\/\* === DATA_END === \*\//);
  if(!m){ alert("模板缺少 DATA 标记，无法编辑"); return; }
  const src = m[1].replace(/^\s*const\s+content\s*=\s*/,"").replace(/;\s*$/,"").trim();
  data = (new Function("return "+src))();
}
function genHtml(){
  (data.tiles||[]).forEach(t=>{ if(t.id) t.link = "works/" + t.id + ".html"; });
  return injectData(tplHtml, data);
}

/* ---------- 工具 ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function getPath(o,p){ return p.split(".").reduce((a,k)=>a?a[k]:undefined,o); }
function setPath(o,p,v){ const ks=p.split("."); let c=o; for(let i=0;i<ks.length-1;i++) c=c[ks[i]]; c[ks[ks.length-1]]=v; }
function opt(list,val){ return list.map(o=>`<option value="${o.v}"${o.v===val?" selected":""}>${o.t}</option>`).join(""); }
const TILE_COLORS=[{v:"c-red",t:"珊瑚红"},{v:"c-orange",t:"橙"},{v:"c-yellow",t:"黄"},{v:"c-teal",t:"青"},{v:"c-blue",t:"蓝"},{v:"c-lime",t:"绿"},{v:"c-paper",t:"白纸"}];
const TILE_SIZES=[{v:"normal",t:"正常块"},{v:"wide",t:"大块(占两格)"}];
const STOP_COLORS=[{v:"var(--red)",t:"红"},{v:"var(--orange)",t:"橙"},{v:"var(--teal)",t:"青"},{v:"var(--blue)",t:"蓝"}];
const ACCENT_OPTS=[{v:"red",t:"珊瑚红"},{v:"orange",t:"橙"},{v:"yellow",t:"黄"},{v:"teal",t:"青"},{v:"blue",t:"蓝"},{v:"lime",t:"绿"}];
const STAGE_OPTS=[{v:"",t:"无（用演示页 / 不演示）"},{v:"pet",t:"桌宠迷你养成（内嵌可交互）"}];

/* 可选演示页清单：学生不写代码也能挑一个挂上去 */
const DEMO_CATALOG=[
  {v:"",t:"（不挂演示页，只显示说明）"},
  {v:"demo/voice/index.html",t:"语音助手 · 浏览器里直接对话",lab:"LIVE DEMO · 浏览器里直接说话",btn:"新窗口打开 ↗",h:"min(86vh,780px)",
   hint:"演示模式：语音识别与朗读由浏览器完成，回答由页面内置的资料检索生成。想让它答得更准，点右上「📚 知识库」上传你自己的 .md / .txt 资料，立刻就能被问到。"},
  {v:"demo/jump.html",t:"网页小游戏 · 跳一跳（能玩）",lab:"LIVE DEMO · 现在就能玩",btn:"全屏打开 ↗",h:"",hint:"这是实际成品：按住鼠标 / 手指蓄力，松手起跳，落到台上得分。"},
  {v:"demo/game2048.html",t:"2048 · 棋盘可玩 + AI 接管",lab:"LIVE DEMO · 棋盘能玩，AI 也能自己玩",btn:"新窗口打开 ↗",h:"min(88vh,820px)",
   hint:"棋盘可以直接用方向键或手指滑动玩。点「AI 接管」，右边会同步显示它的三步：看清棋盘 → 给四个方向打分 → 决定按下哪个键。"},
  {v:"demo/crypto.html",t:"加密逆向 · 三层加密真算",lab:"LIVE DEMO · 三层加密真算一遍",btn:"新窗口打开 ↗",h:"min(88vh,860px)",
   hint:"页面里是真的在做运算：两层 AES-128-CBC 走浏览器加密接口，RSA 用自实现的大整数模幂。点「运行校验」会拿固定输入和参考真值逐字节比对。"},
  {v:"demo/memory.html",t:"本地记忆库 · 真存真检索",lab:"LIVE DEMO · 真存、真检索、真隔离",btn:"新窗口打开 ↗",h:"min(88vh,840px)",
   hint:"往里加几条记忆、删几条、按项目切着看，然后提问——它会把「意思对但用词不同」的记忆找回来，并显示相似度。"},
  {v:"demo/plan-api.html",t:"计划后端 · 请求响应日志",lab:"LIVE DEMO · 提交一次，落一次库",btn:"新窗口打开 ↗",h:"min(88vh,860px)",
   hint:"左边提交计划，右边实时打出这次请求的方法、路径、请求体和响应 JSON，底部还有数据库表视图。"},
  {v:"demo/trending.html",t:"GitHub 巡检 · 实时采集打分",lab:"LIVE DEMO · 跑一次巡检",btn:"新窗口打开 ↗",h:"min(88vh,860px)",
   hint:"点「开始巡检」会真的去调 GitHub 接口，把冒头的新项目拉回来（接口拿不到就自动用内置快照），再按四个维度打分。"},
  {v:"demo/media-pipeline.html",t:"自媒体流水线 · 四步走完",lab:"LIVE DEMO · 完整跑一遍流水线",btn:"新窗口打开 ↗",h:"min(88vh,880px)",
   hint:"点「运行流水线」，四步依次点亮：抓四个平台的热榜 → 交叉验证挑出唯一选题 → 按固定结构出初稿 → 走发布流程。"},
  {v:"demo/pack.html",t:"打包工具集 · 四种场景",lab:"LIVE DEMO · 四种打包场景随便试",btn:"新窗口打开 ↗",h:"min(86vh,800px)",
   hint:"四个场景逐个点「开始打包」，看真实的打包输出、产物体积和各自容易踩的坑。"},
  {v:"demo/price.html",t:"价格走势图 · 真实监控数据",lab:"LIVE DEMO · 真实监控数据",btn:"全屏打开 ↗",h:"",hint:"10 次真实扫描：从 ¥4299 一路探到 ¥1088。悬停看每次价格，点圆点可跳商品页。"},
  {v:"demo/cars.html",t:"采集结果表 · 真实抓取数据",lab:"LIVE DEMO · 真实采集结果",btn:"全屏打开 ↗",h:"",hint:"40 台二手车的真实抓取数据：按城市筛选，按价格 / 里程 / 年份排序。"},
  {v:"demo/comments.html",t:"评论结果 · 真实抓取数据",lab:"LIVE DEMO · 真实采集结果",btn:"全屏打开 ↗",h:"",hint:"20 条实际抓取的评论：支持搜索与关键词热度统计。"},
];

/* ---------- 表单渲染 ---------- */
function buildForm(){
  form.innerHTML = basicHTML() + tilesHTML() + stopsHTML() + skillsHTML() + chatHTML() + socialsHTML() + detailHTML();
}
function basicHTML(){
  return `<section class="card">
    <h3>① 基本信息</h3>
    <label>站名 / Logo 文字<input type="text" data-path="name" value="${esc(data.name)}"></label>
    <label>一句话简介（副标题）<span class="hint">支持换行，用 &lt;br&gt; 手动断行</span><textarea data-path="sub" rows="3">${esc(data.sub)}</textarea></label>
    <label>联系邮箱<input type="text" data-path="email" value="${esc(data.email)}"></label>
    <label>GitHub 链接<input type="url" data-path="github" value="${esc(data.github)}"></label>
    <label>顶部跑马灯关键词<span class="hint">逗号或换行分隔</span><textarea data-path="marquee" rows="2">${esc((data.marquee||[]).join("，"))}</textarea></label>
  </section>`;
}
function tilesHTML(){
  const items = data.tiles.map((t,i)=>`
    <div class="item">
      <div class="dh">作品 #${i+1} <button class="mini del" data-act="delTile:${i}">删除</button></div>
      <div class="row">
        <label>序号<input type="text" data-path="tiles.${i}.num" value="${esc(t.num)}"></label>
        <label>分类<input type="text" data-path="tiles.${i}.cat" value="${esc(t.cat)}"></label>
      </div>
      <label>标题<input type="text" data-path="tiles.${i}.title" value="${esc(t.title)}"></label>
      <label>描述<textarea data-path="tiles.${i}.desc" rows="2">${esc(t.desc)}</textarea></label>
      <div class="row">
        <label>色块<select data-path="tiles.${i}.color">${opt(TILE_COLORS,t.color)}</select></label>
        <label>大小<select data-path="tiles.${i}.size">${opt(TILE_SIZES,t.size)}</select></label>
      </div>
      <label>标签<span class="hint">逗号分隔，如 EXE，Python</span><input type="text" data-path="tiles.${i}.tags" value="${esc((t.tags||[]).join("，"))}"></label>
      <label>跳转链接<span class="hint">作品详情页网址，可留空</span><input type="url" data-path="tiles.${i}.link" value="${esc(t.link||"")}"></label>
    </div>`).join("");
  return `<section class="card">
    <h3>② 作品（便当格）</h3>
    ${items}
    <div class="addline"><button class="mini add" data-act="addTile">＋ 添加作品</button></div>
  </section>`;
}
function stopsHTML(){
  const items = data.stops.map((s,i)=>{
    const ls = s.lessons.map((l,j)=>`
      <div class="lrow">
        <input type="text" data-path="stops.${i}.lessons.${j}.0" value="${esc(l[0])}" placeholder="内容">
        <input type="text" data-path="stops.${i}.lessons.${j}.1" value="${esc(l[1])}" placeholder="标签">
        <button class="mini del" data-act="delLesson:${i}:${j}">✕</button>
      </div>`).join("");
    return `<div class="item">
      <div class="dh">阶段 #${i+1} <button class="mini del" data-act="delStop:${i}">删除</button></div>
      <div class="row">
        <label>站点序号<input type="text" data-path="stops.${i}.mark" value="${esc(s.mark)}"></label>
        <label>颜色<select data-path="stops.${i}.color">${opt(STOP_COLORS,s.color)}</select></label>
      </div>
      <label>阶段名称<input type="text" data-path="stops.${i}.name" value="${esc(s.name)}"></label>
      <label>小标签<input type="text" data-path="stops.${i}.tag" value="${esc(s.tag)}"></label>
      <label>碎片（每个 = 一行内容 + 标签）</label>
      ${ls}
      <div class="addline"><button class="mini add" data-act="addLesson:${i}">＋ 加碎片</button></div>
    </div>`;
  }).join("");
  return `<section class="card">
    <h3>③ 成长轨迹（节点）</h3>
    ${items}
    <div class="addline"><button class="mini add" data-act="addStop">＋ 添加阶段</button></div>
  </section>`;
}
function skillsHTML(){
  const items = data.skills.map((s,i)=>`
    <div class="item">
      <div class="dh">技能 #${i+1} <button class="mini del" data-act="delSkill:${i}">删除</button></div>
      <div class="row">
        <label>名称<input type="text" data-path="skills.${i}.name" value="${esc(s.name)}"></label>
        <label>熟练度（1-5 盏灯）<select data-path="skills.${i}.level">${[1,2,3,4,5].map(n=>`<option value="${n}"${n===s.level?" selected":""}>${n} 灯</option>`).join("")}</select></label>
      </div>
    </div>`).join("");
  return `<section class="card">
    <h3>④ 技能（贴纸墙）</h3>
    ${items}
    <div class="addline"><button class="mini add" data-act="addSkill">＋ 添加技能</button></div>
  </section>`;
}
function chatHTML(){
  const items = data.chat.map((c,i)=>`
    <div class="item">
      <div class="dh">对话 #${i+1} <button class="mini del" data-act="delChat:${i}">删除</button></div>
      <label>提问方文字<input type="text" data-path="chat.${i}.who" value="${esc(c.who)}"></label>
      <label class="row" style="display:flex;align-items:center;gap:8px;font-weight:700">
        <input type="checkbox" data-path="chat.${i}.me" ${c.me?"checked":""} style="width:auto;margin:0"> 这句是「我」说的（右侧深色气泡）
      </label>
      <label>内容<textarea data-path="chat.${i}.text" rows="2">${esc(c.text)}</textarea></label>
    </div>`).join("");

/* ---------- 交互绑定 ---------- */
function bindGlobal(){
  form.addEventListener("input", onInput);
  form.addEventListener("click", onClick);
  $("#download").addEventListener("click", download);
  $("#genSite").addEventListener("click", genSite);
  $("#saveDraft").addEventListener("click", ()=>{ localStorage.setItem(DRAFT, JSON.stringify(data)); toast("已存草稿到本机"); });
  $("#loadDraft").addEventListener("click", ()=>{
    const d = localStorage.getItem(DRAFT);
    if(!d){ toast("没有草稿"); return; }
    data = JSON.parse(d); buildForm(); renderPreview(); toast("已读取草稿");
  });
  $("#reset").addEventListener("click", ()=>{
    if(!confirm("重置为模板默认内容？当前编辑会丢失（草稿不受影响）。")) return;
    parseData(); buildForm(); renderPreview(); toast("已重置");
  });
}
function onInput(e){
  const el = e.target;
  const demoIdx = el.dataset.demo, stageIdx = el.dataset.stage;
  if(demoIdx!=null){
    const t = data.tiles[+demoIdx]; if(!t.detail) return;
    const v = el.value;
    if(!v) t.detail.demo = null;
    else { const c = DEMO_CATALOG.find(o=>o.v===v);
      t.detail.demo = {src:v, lab:c.lab, btn:c.btn, hint:c.hint, h:c.h||""}; }
    buildForm(); renderPreview(); return;
  }
  if(stageIdx!=null){
    const t = data.tiles[+stageIdx]; if(!t.detail) return;
    t.detail.stage = el.value || null;
    buildForm(); renderPreview(); return;
  }
  const el2 = e.target, p = el2.dataset.path; if(!p) return;
  let v = el2.value;
  if(p==="marquee"){ data.marquee = v.split(/[，,\n]/).map(s=>s.trim()).filter(Boolean); }
  else if(p.endsWith(".tags")){ v = v.split(/[，,\n]/).map(s=>s.trim()).filter(Boolean); setPath(data,p,v); }
  else if(p.endsWith(".did") || p.endsWith(".highlights") || p.endsWith(".items") || p.endsWith(".badges")){
    v = v.split("\n").map(s=>s.trim()).filter(Boolean); setPath(data,p,v);
  }
  else if(p.endsWith(".id")){ v = String(v).replace(/[^a-zA-Z0-9\-_]/g,"").toLowerCase(); setPath(data,p,v); }
  else if(p.endsWith(".level")){ setPath(data,p, +v); }
  else if(p.endsWith(".me")){ setPath(data,p, el.checked); }
  else setPath(data,p,v);
  schedulePreview();
}
function onClick(e){
  const b = e.target.closest("[data-act]"); if(!b) return;
  const [act,a,b2] = b.dataset.act.split(":");
  if(act==="addTile") data.tiles.push({id:"work-"+(data.tiles.length+1),cat:"应用开发",size:"normal",color:"c-red",num:String(data.tiles.length+1).padStart(2,"0"),title:"新作品",desc:"一句话简介",tags:[],link:"",
    detail:{accent:"red",lead:"一句话说清这个作品做了什么。",bg:"",did:["做了什么"],highlights:["亮点"],demo:null,stage:null,extra:null}});
  else if(act==="delTile") data.tiles.splice(+a,1);
  else if(act==="initDetail"){ const t=data.tiles[+a];
    t.id = t.id || ("work-"+(data.tiles.length));
    if(!t.detail) t.detail={accent:"red",lead:"一句话说清这个作品做了什么。",bg:"",did:["做了什么"],highlights:["亮点"],demo:null,stage:null,extra:null}; }
  else if(act==="addExtra"){ const t=data.tiles[+a]; if(t.detail) t.detail.extra={title:"补充说明",note:"",items:["条目"],badges:["标签"]}; }
  else if(act==="delExtra"){ const t=data.tiles[+a]; if(t.detail) t.detail.extra=null; }
  else if(act==="addStop") data.stops.push({mark:String(data.stops.length+1),name:"新阶段",color:"var(--red)",tag:"标签",lessons:[["内容","标签"]]});
  else if(act==="delStop") data.stops.splice(+a,1);
  else if(act==="addLesson") data.stops[+a].lessons.push(["新内容","新标签"]);
  else if(act==="delLesson") data.stops[+a].lessons.splice(+b2,1);
  else if(act==="addSkill") data.skills.push({name:"新技能",level:3});
  else if(act==="delSkill") data.skills.splice(+a,1);
  else if(act==="addChat") data.chat.push({who:"Q · 新问答",me:false,text:"内容"});
  else if(act==="delChat") data.chat.splice(+a,1);
  else if(act==="addSocial") data.socials.push({name:"新平台",url:""});
  else if(act==="delSocial") data.socials.splice(+a,1);
  buildForm(); renderPreview();
}
let timer;
function schedulePreview(){ clearTimeout(timer); timer=setTimeout(renderPreview,250); }
function renderPreview(){ prev.srcdoc = genHtml(); }

function download(){
  const html = genHtml();
  const blob = new Blob([html], {type:"text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已下载 index.html，覆盖到仓库即可");
}
let tT;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(tT); tT=setTimeout(()=>toastEl.classList.remove("show"),2200); }

  var NAME = { cat:'🐱 猫', dog:'🐶 狗', penguin:'🐧 企鹅' };
  var PHRASES = {
    cat:   ['喵~ 一起加油鸭','喵呜？','小鱼干！我要小鱼干！','（尾巴摇了摇）','（蹭了蹭你的手）'],

    penguin:['（摇摆摇摆）','咕咕？','鱼！鱼！鱼！','（滑了一跤）','（拍拍翅膀）']

  function setImg(n){ pet.src = 'assets/pet/' + S.sp + '_' + n + '.png'; }
  function refreshImg(){
    if (S.sleeping) return setImg('sleep');
    if (S.walking)  return setImg(PETSP[S.sp].base);
    setImg(S.mood < 35 ? PETSP[S.sp].hungry : PETSP[S.sp].base);
  }
  function tempImg(n, ms){ setImg(n); setTimeout(refreshImg, ms); }
  function say(t){
    bubble.textContent = t; bubble.hidden = false;
    clearTimeout(say._t); say._t = setTimeout(function(){ bubble.hidden = true; }, 2200);
  }
  function rand(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function detailPages(c){
  return (c.tiles||[]).filter(t=>t && t.detail && t.id).map(t=>({
    path: 'works/' + t.id + '.html',
    text: detailPage({
      slug: t.id, cat: t.cat, accent: (t.detail.accent||'red'), title: t.title,
      lead: t.detail.lead||'', tags: t.tags||[], bg: t.detail.bg||'',
      did: t.detail.did||[], highlights: t.detail.highlights||[],
      demo: t.detail.demo||null, stage: t.detail.stage||null, extra: t.detail.extra||null
    }, c.name||'我的作品集')
  }));
}

/* ---------- ZIP 打包（store 模式，无依赖，浏览器/Node 通用） ---------- */
let CRC_T = null;
function crcTable(){
  if(CRC_T) return CRC_T;
  CRC_T = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); CRC_T[n]=c>>>0; }
  return CRC_T;
}
function crc32(u8){
  const t = crcTable(); let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = t[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}
function buildZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1)) & 0xFFFF);
  const dosDate = ((((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFFFF);
  files.forEach(f=>{
    const nameB = enc.encode(f.path);
    const data = f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nameB.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameB.length, true);
    lv.setUint16(28, 0, true);
    lh.set(nameB, 30);
    parts.push(lh, data);

    const ch = new Uint8Array(46 + nameB.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nameB, 46);
    central.push(ch);

    offset += lh.length + data.length;
  });
  const cenSize = central.reduce((a,b)=>a+b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cenSize, true);
  ev.setUint32(16, offset, true);
  const all = parts.concat(central, [eocd]);
  const total = all.reduce((a,b)=>a+b.length, 0);
  const out = new Uint8Array(total);
  let p = 0; all.forEach(c=>{ out.set(c, p); p += c.length; });
  return out;
}

/* ---------- 需要一起打包的既有文件（演示页 + 素材） ---------- */
function neededFiles(c){
  const set = new Set();
  (c.tiles||[]).forEach(t=>{
    const d = t.detail; if(!d) return;
    if(d.demo && d.demo.src){
      set.add('works/' + d.demo.src);
      if(d.demo.src.indexOf('demo/voice/') === 0){
        set.add('works/demo/voice/app.js');
        set.add('works/demo/voice/style.css');
      }
    }
    if(d.stage === 'pet') PET_FILES.forEach(f=>set.add(f));
  });
  return [...set];
}
/* ---------- 生成完整站点 ---------- */
const LOCAL_FILES = {};
const OPTIONAL = ['admin.html', 'works/demo/voice/index.html'];

async function readOne(path){
  const f = LOCAL_FILES[path];
  if(f) return new Uint8Array(await f.arrayBuffer());
  try{
    const r = await fetch("./" + path, {cache:"no-store"});
    if(!r.ok) return null;
    return new Uint8Array(await r.arrayBuffer());
  }catch(e){ return null; }
}

$("#dirPick").addEventListener("change", e=>{
  const fs = [...e.target.files];
  if(!fs.length) return;
  let n = 0;
  fs.forEach(f=>{
    const rel = (f.webkitRelativePath || f.name).split("/").slice(1).join("/");
    if(rel){ LOCAL_FILES[rel] = f; n++; }
  });
  toast("已载入 " + n + " 个文件，可以点「生成完整站点」了");
});

async function genSite(){
  if(!data || !tplHtml){ alert("还没加载到 index.html 模板。请先在页面上选择一次 index.html（本地模式下会弹选择框），再点生成。"); return; }
  const btn = $("#genSite");
  btn.disabled = true; btn.textContent = "正在生成…";
  try{
    data.tiles.forEach(t=>{ if(t.id) t.link = "works/" + t.id + ".html"; });

    const enc = new TextEncoder();
    const pages = detailPages(data);
    const need = neededFiles(data);

    const files = [], missing = [], okList = [];
    files.push({path:"index.html", data: enc.encode(genHtml())});
    okList.push("index.html（首页）");
    pages.forEach(p=>{ files.push({path:p.path, data: enc.encode(p.text)}); okList.push(p.path); });

    for(const p of need){
      const buf = await readOne(p);
      if(buf){ files.push({path:p, data:buf}); okList.push(p); }
      else missing.push(p);
    }
    const buf = await readOne("admin.html");
    if(buf){ files.push({path:"admin.html", data:buf}); okList.push("admin.html（后台，可在线上继续编辑）"); }

    // .nojekyll —— 让 GitHub Pages 原样输出文件（不加的话带下划线/点号的文件会被忽略，导致 404）
    files.push({path:".nojekyll", data: enc.encode("")});
    okList.push(".nojekyll（GitHub Pages 必需，别删）");

    files.push({path:"README.md", data: enc.encode(deployReadme(data))});

    const zip = buildZip(files);
    const blob = new Blob([zip], {type:"application/zip"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "portfolio-site.zip"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);

    showReport({files, okList, missing, bytes: zip.length, pages: pages.length});
  }catch(err){
    alert("生成失败：" + err.message);
  }finally{
    btn.disabled = false; btn.textContent = "⚡ 生成完整站点";
  }
}

function showReport(r){
  const mb = (r.bytes/1048576).toFixed(2);
  const missingHtml = r.missing.length
    ? `<li class="no">缺少 ${r.missing.length} 个文件（这些演示页/素材没抓到，先确认你在网站环境下打开，或先选一次项目文件夹）：
        <br>${r.missing.slice(0,12).map(x=>hEsc(x)).join("<br>")}${r.missing.length>12?"<br>…":""}</li>`
    : `<li class="ok">演示页与素材全部打包齐全</li>`;
  $("#repBox").innerHTML = `
    <h2>✅ 已生成 portfolio-site.zip</h2>
    <div class="big">${r.okList.length} 个文件 · ${mb} MB · 其中详情页 ${r.pages} 个</div>
    <div class="tip">下一步：<b>先解压</b>（别把 zip 直接传上去）→ 打开解压出来的文件夹，全选里面的文件和文件夹 → 一起拖进 GitHub 仓库根目录 → Commit。仓库 Settings → Pages 选 main / (root)，一两分钟后就能访问。包里的 <b>README.md</b> 写了完整步骤（GitHub 仓库首页会自动显示它）。以后想改内容，打开 <b>站点地址/admin.html</b> 再生成一次即可。</div>
    <ul>
      ${missingHtml}
      ${r.okList.map(x=>`<li class="ok">${hEsc(x)}</li>`).join("")}
    </ul>
    <div class="acts">
      <button class="btn primary" id="repClose">知道了</button>
      <button class="btn" id="repHome">只下载 index.html</button>
    </div>`;
  $("#rep").classList.remove("hidden");
  $("#repClose").onclick = ()=>$("#rep").classList.add("hidden");
  $("#repHome").onclick = ()=>{ $("#rep").classList.add("hidden"); download(); };
}

init();
</script>
</body>
</html>
